name: Community Skill Checks

on:
  push:
    branches: [main, community-v1]
  pull_request:
    branches: [main]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r skills/analizador-web/requirements.txt
      - name: Compile Python
        run: python -m compileall -q skills/analizador-web/scripts tests
      - name: Run safety tests
        run: python -m unittest discover -s tests -v
      - name: Build Skill ZIP
        run: python scripts/package_skill.py
      - name: Verify ZIP layout
        run: python -c "from zipfile import ZipFile; z=ZipFile('dist/analizador-web-1.0.0.zip'); assert 'SKILL.md' in z.namelist(); assert 'scripts/analyze_site.py' in z.namelist()"
